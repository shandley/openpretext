<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" font-family="Arial, Helvetica, sans-serif">
  <rect width="700" height="280" fill="white"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Phase 1: Link Scoring -->
  <rect x="20" y="30" width="180" height="220" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="110" y="22" font-size="12" font-weight="bold" fill="#1976d2" text-anchor="middle">Phase 1: Link Scoring</text>

  <!-- Mini contact map showing inter-contig block -->
  <rect x="45" y="50" width="130" height="80" fill="#f5f5f5" stroke="#999" stroke-width="0.5"/>
  <!-- Diagonal blocks -->
  <rect x="45" y="50" width="55" height="55" fill="#ffcdd2" stroke="none"/>
  <rect x="120" y="75" width="55" height="55" fill="#ffcdd2" stroke="none"/>
  <!-- Anti-diagonal band (scoring region) -->
  <rect x="100" y="50" width="20" height="25" fill="#ffeb3b" fill-opacity="0.5" stroke="#f57f17" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="45" y="105" width="25" height="20" fill="#ffeb3b" fill-opacity="0.5" stroke="#f57f17" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Labels -->
  <text x="72" y="82" font-size="9" fill="#c62828" text-anchor="middle">Contig A</text>
  <text x="148" y="107" font-size="9" fill="#c62828" text-anchor="middle">Contig B</text>
  <text x="110" y="62" font-size="8" fill="#f57f17" text-anchor="middle">score region</text>

  <!-- Orientation icons -->
  <text x="110" y="155" font-size="10" fill="#333" text-anchor="middle">4 orientations scored:</text>
  <g font-size="9" fill="#555" text-anchor="middle">
    <text x="55" y="175">H→H</text>
    <text x="90" y="175">H→T</text>
    <text x="125" y="175">T→H</text>
    <text x="160" y="175">T→T</text>
  </g>
  <text x="110" y="200" font-size="9" fill="#666" text-anchor="middle">Anti-diagonal intensity</text>
  <text x="110" y="215" font-size="9" fill="#666" text-anchor="middle">vs diagonal baseline</text>
  <text x="110" y="230" font-size="9" fill="#666" text-anchor="middle">1/√d distance weighting</text>

  <!-- Arrow 1→2 -->
  <line x1="205" y1="140" x2="240" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 2: Greedy Chaining -->
  <rect x="245" y="30" width="180" height="220" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="335" y="22" font-size="12" font-weight="bold" fill="#388e3c" text-anchor="middle">Phase 2: Greedy Chaining</text>

  <!-- Chain visualization -->
  <g transform="translate(265, 55)">
    <!-- Sorted links -->
    <rect x="0" y="0" width="140" height="20" rx="3" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1"/>
    <text x="70" y="14" font-size="9" fill="#333" text-anchor="middle">Links sorted by score ↓</text>

    <!-- Union-Find chains forming -->
    <g transform="translate(0, 35)">
      <circle cx="15" cy="10" r="8" fill="#81c784" stroke="#388e3c" stroke-width="1"/>
      <circle cx="40" cy="10" r="8" fill="#81c784" stroke="#388e3c" stroke-width="1"/>
      <circle cx="65" cy="10" r="8" fill="#81c784" stroke="#388e3c" stroke-width="1"/>
      <line x1="23" y1="10" x2="32" y2="10" stroke="#388e3c" stroke-width="2"/>
      <line x1="48" y1="10" x2="57" y2="10" stroke="#388e3c" stroke-width="2"/>
      <text x="40" y="35" font-size="9" fill="#555" text-anchor="middle">Chain 1</text>

      <circle cx="95" cy="10" r="8" fill="#a5d6a7" stroke="#388e3c" stroke-width="1"/>
      <circle cx="120" cy="10" r="8" fill="#a5d6a7" stroke="#388e3c" stroke-width="1"/>
      <line x1="103" y1="10" x2="112" y2="10" stroke="#388e3c" stroke-width="2"/>
      <text x="107" y="35" font-size="9" fill="#555" text-anchor="middle">Chain 2</text>
    </g>
  </g>

  <text x="335" y="155" font-size="10" fill="#333" text-anchor="middle">Union-Find structure</text>
  <text x="335" y="175" font-size="9" fill="#666" text-anchor="middle">Accept if both contigs</text>
  <text x="335" y="190" font-size="9" fill="#666" text-anchor="middle">at chain endpoints &amp;</text>
  <text x="335" y="205" font-size="9" fill="#666" text-anchor="middle">in different chains</text>
  <text x="335" y="225" font-size="9" fill="#666" text-anchor="middle">Reverse/invert as needed</text>

  <!-- Arrow 2→3 -->
  <line x1="430" y1="140" x2="465" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 3: Hierarchical Merging -->
  <rect x="470" y="30" width="210" height="220" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="575" y="22" font-size="12" font-weight="bold" fill="#c62828" text-anchor="middle">Phase 3: Hierarchical Merging</text>

  <!-- Merging visualization -->
  <g transform="translate(490, 55)">
    <!-- Two chains merging -->
    <g>
      <circle cx="15" cy="10" r="7" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
      <circle cx="35" cy="10" r="7" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
      <circle cx="55" cy="10" r="7" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
      <line x1="22" y1="10" x2="28" y2="10" stroke="#c62828" stroke-width="2"/>
      <line x1="42" y1="10" x2="48" y2="10" stroke="#c62828" stroke-width="2"/>
    </g>
    <g>
      <circle cx="95" cy="10" r="7" fill="#f48fb1" stroke="#c62828" stroke-width="1"/>
      <circle cx="115" cy="10" r="7" fill="#f48fb1" stroke="#c62828" stroke-width="1"/>
      <circle cx="135" cy="10" r="7" fill="#f48fb1" stroke="#c62828" stroke-width="1"/>
      <circle cx="155" cy="10" r="7" fill="#f48fb1" stroke="#c62828" stroke-width="1"/>
      <line x1="102" y1="10" x2="108" y2="10" stroke="#c62828" stroke-width="2"/>
      <line x1="122" y1="10" x2="128" y2="10" stroke="#c62828" stroke-width="2"/>
      <line x1="142" y1="10" x2="148" y2="10" stroke="#c62828" stroke-width="2"/>
    </g>

    <!-- Merge arrow -->
    <path d="M55,22 L85,40" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M115,22 L85,40" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Merged chain -->
    <g transform="translate(0, 45)">
      <circle cx="15" cy="10" r="7" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
      <circle cx="35" cy="10" r="7" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
      <circle cx="55" cy="10" r="7" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
      <circle cx="75" cy="10" r="7" fill="#f48fb1" stroke="#c62828" stroke-width="1"/>
      <circle cx="95" cy="10" r="7" fill="#f48fb1" stroke="#c62828" stroke-width="1"/>
      <circle cx="115" cy="10" r="7" fill="#f48fb1" stroke="#c62828" stroke-width="1"/>
      <circle cx="135" cy="10" r="7" fill="#f48fb1" stroke="#c62828" stroke-width="1"/>
      <line x1="22" y1="10" x2="28" y2="10" stroke="#c62828" stroke-width="2"/>
      <line x1="42" y1="10" x2="48" y2="10" stroke="#c62828" stroke-width="2"/>
      <line x1="62" y1="10" x2="68" y2="10" stroke="#c62828" stroke-width="2"/>
      <line x1="82" y1="10" x2="88" y2="10" stroke="#c62828" stroke-width="2"/>
      <line x1="102" y1="10" x2="108" y2="10" stroke="#c62828" stroke-width="2"/>
      <line x1="122" y1="10" x2="128" y2="10" stroke="#c62828" stroke-width="2"/>
      <text x="75" y="35" font-size="9" fill="#555" text-anchor="middle">Chromosome chain</text>
    </g>
  </g>

  <text x="575" y="185" font-size="10" fill="#333" text-anchor="middle">Agglomerative merging</text>
  <text x="575" y="205" font-size="9" fill="#666" text-anchor="middle">Safety guard: inter-chain</text>
  <text x="575" y="220" font-size="9" fill="#666" text-anchor="middle">affinity > 50% of mean</text>
  <text x="575" y="235" font-size="9" fill="#666" text-anchor="middle">intra-chain score</text>

  <!-- Bottom: Output -->
  <text x="350" y="272" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Output: Ordered, oriented chromosome-scale chains (mean τ = 0.988)</text>
</svg>
