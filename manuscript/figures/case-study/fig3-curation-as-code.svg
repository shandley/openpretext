<svg xmlns="http://www.w3.org/2000/svg" width="519" height="508.72" viewBox="0 0 519 508.72">
<rect width="519" height="508.72" fill="#ffffff"/>
<text x="10" y="22" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">A</text><text x="24" y="22" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#000000">An illustrative curation protocol, written as a script</text>
<rect x="10" y="30" width="499" height="209.4" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="0.5"/>
<text x="17" y="41" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"># Illustrative curation protocol, king quail bCotChi1 (hap1 + hap2 combined map).</text>
<text x="17" y="50.4" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"># Every line is an operation or a check. Re-running this file reproduces the</text>
<text x="17" y="59.8" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"># curation exactly, and the asserts make it fail loudly if the input assembly</text>
<text x="17" y="69.2" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"># is not the one the protocol was written against.</text>
<text x="17" y="78.60000000000001" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"></text>
<text x="17" y="88.00000000000001" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#E69F00" xml:space="preserve">assert contigs == 645</text>
<text x="17" y="97.40000000000002" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#E69F00" xml:space="preserve">assert n50 &gt; 40Mb</text>
<text x="17" y="106.80000000000003" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"></text>
<text x="17" y="116.20000000000003" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"># Reverse a scaffold whose diagonal runs the wrong way.</text>
<text x="17" y="125.60000000000004" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#0072B2" xml:space="preserve">invert H1.scaffold_4</text>
<text x="17" y="135.00000000000003" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"></text>
<text x="17" y="144.40000000000003" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"># Bring a mis-ordered scaffold next to its neighbour.</text>
<text x="17" y="153.80000000000004" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#0072B2" xml:space="preserve">move H1.scaffold_54 after H1.scaffold_1</text>
<text x="17" y="163.20000000000005" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"></text>
<text x="17" y="172.60000000000005" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"># Group a scaffold into a named chromosome.</text>
<text x="17" y="182.00000000000006" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#0072B2" xml:space="preserve">scaffold create SUPER_1</text>
<text x="17" y="191.40000000000006" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#0072B2" xml:space="preserve">scaffold paint H1.scaffold_1 SUPER_1</text>
<text x="17" y="200.80000000000007" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"></text>
<text x="17" y="210.20000000000007" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve"># Curation rearranges sequence; it must never lose any.</text>
<text x="17" y="219.60000000000008" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#E69F00" xml:space="preserve">assert contigs == 645</text>
<text x="17" y="229.00000000000009" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#E69F00" xml:space="preserve">assert scaffolds == 1</text>
<text x="10" y="245.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="7" fill="#555555"><tspan fill="#E69F00">assertions</tspan> state what must hold; <tspan fill="#0072B2">operations</tspan> change the assembly.</text>
<text x="10" y="263.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">B</text><text x="24" y="263.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#000000">Run headlessly, with no browser; the same check gates CI</text>
<rect x="10" y="271.4" width="499" height="143.72" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="0.5"/>
<text x="17" y="282.4" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve">$ npx tsx bench/curate.ts --pretext test-data/case-study/quail/bCotChi1.combined.pretext \</text>
<text x="17" y="291.79999999999995" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#555555" xml:space="preserve">      --script manuscript/case-study/demo-curation.dsl --out curated.agp</text>
<text x="17" y="304.9599999999999" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#009E73">ok</text><text x="34" y="304.9599999999999" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">Assertion passed: contigs == 645 (actual 645)</text>
<text x="17" y="314.3599999999999" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#009E73">ok</text><text x="34" y="314.3599999999999" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">Assertion passed: N50 &gt; 40.00 Mb (actual 85.71 Mb)</text>
<text x="17" y="323.7599999999999" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#009E73">ok</text><text x="34" y="323.7599999999999" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">Inverted contig 'H1.scaffold_4'</text>
<text x="17" y="333.15999999999985" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#009E73">ok</text><text x="34" y="333.15999999999985" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">Moved contig to after position 0</text>
<text x="17" y="342.55999999999983" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#009E73">ok</text><text x="34" y="342.55999999999983" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">Created scaffold 'SUPER_1' (id=1)</text>
<text x="17" y="351.9599999999998" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#009E73">ok</text><text x="34" y="351.9599999999998" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">Painted contig at position 0 with scaffold 'SUPER_1'</text>
<text x="17" y="361.3599999999998" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#009E73">ok</text><text x="34" y="361.3599999999998" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">Assertion passed: contigs == 645 (actual 645)</text>
<text x="17" y="370.75999999999976" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#009E73">ok</text><text x="34" y="370.75999999999976" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">Assertion passed: scaffolds == 1 (actual 1)</text>
<text x="17" y="383.91999999999973" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">1 reoriented, 1 grouped into 1 named scaffold. Contigs 645 -> 645, N50 85.71 Mb unchanged.</text>
<text x="17" y="393.3199999999997" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">Rearrangement changes neither.  Result: <tspan fill="#009E73" font-weight="bold">success</tspan></text>
<text x="10" y="433.12" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">C</text><text x="24" y="433.12" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#000000">Two independent runs, same bytes</text>
<rect x="10" y="441.12" width="499" height="57.6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="0.5"/>
<text x="17" y="453.12" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">run 1  sha256  094a9a3bcdaec08cd8fd2c8b65f6c4a7…</text>
<text x="17" y="462.52" font-family="'DejaVu Sans Mono', 'Menlo', monospace" font-size="7.2" fill="#000000">run 2  sha256  094a9a3bcdaec08cd8fd2c8b65f6c4a7…</text>
<text x="17" y="476.62" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#009E73">identical: 33,167 bytes of AGP, byte for byte</text>
<text x="17" y="488.84000000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="7" fill="#555555">The same protocol re-run on the same assembly is reproducible, so a curation can be diffed, reviewed, and regression-tested.</text>
</svg>